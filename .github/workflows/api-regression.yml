name: API Regression (pytest)

on:
  workflow_dispatch:
  schedule:
    # Weekly regression run; adjust as needed
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e .[dev]

      - name: Run API regression tests (pytest)
        run: |
          mkdir -p test-results
          pytest -q --junitxml=test-results/pytest-junit.xml

      - name: Upload test results (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-results
          path: |
            test-results/pytest-junit.xml
